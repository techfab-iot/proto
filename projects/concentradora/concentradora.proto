syntax = "proto3";

option go_package="github.com/techfab-iot/go-proto/projects/concentradora";
package projects.concentradora;

// Commands the concentrator accepts. Each project numbers its own commands, so
// these values are independent of the fotocelula enum. Firmware released before
// this enum existed handles reboot as the legacy value 10; new firmware accepts
// both until those units are updated.
enum Resource {
    RESOURCE_UNSPECIFIED = 0;
    RESOURCE_REBOOT = 1;
}

enum Alert {
    ALERT_UNSPECIFIED = 0;
    ALERT_NO_VOLTAGE = 1;
    ALERT_LOW_VOLTAGE = 2;
    ALERT_HIGH_VOLTAGE = 3;
    ALERT_HIGH_INTERNAL_TEMPERATURE = 4;
    ALERT_HIGH_EXTERNAL_TEMPERATURE = 5;
    ALERT_POWER_OUTAGE = 7;
}
