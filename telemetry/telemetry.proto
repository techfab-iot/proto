syntax = "proto3";

option go_package="github.com/techfab-iot/go-proto/telemetry";
package telemetry;

enum Resource {
    option allow_alias = true;

    RESOURCE_UNSPECIFIED = 0;
    RESOURCE_TEMPERATURE = 1;            // Cel
    RESOURCE_HUMIDITY = 2;               // %RH
    RESOURCE_LATITUDE = 3;               // Lat
    RESOURCE_LONGITUDE = 4;              // Lon
    RESOURCE_ALTITUDE = 5;               // m
    RESOURCE_POWER = 6;                  // W
    RESOURCE_PRESSURE = 7;               // Pa
    RESOURCE_ANGLE = 8;                  // rad
    RESOURCE_LENGTH = 9;                 // m
    RESOURCE_BREADTH = 10;               // m
    RESOURCE_HEIGHT = 11;                // m
    RESOURCE_WEIGHT = 12;                // kg
    RESOURCE_THICKNESS = 13;             // m
    RESOURCE_DISTANCE = 14;              // m
    RESOURCE_AREA = 15;                  // m2
    RESOURCE_VOLUME = 16;                // m3
    RESOURCE_VELOCITY = 17;              // m/s
    RESOURCE_ELECTRIC_CURRENT = 18;      // A
    RESOURCE_ELECTRIC_POTENTIAL = 19;    // V
    RESOURCE_ELECTRIC_RESISTANCE = 20;   // Ohm
    RESOURCE_ILLUMINANCE = 21;           // lx
    RESOURCE_ACCELERATION_X = 22;        // m/s2
    RESOURCE_ACCELERATION_Y = 23;        // m/s2
    RESOURCE_ACCELERATION_Z = 24;        // m/s2
    RESOURCE_HEADING = 25;               // rad
    RESOURCE_CO_CONCENTRATION = 26;      // ppm
    RESOURCE_CO2_CONCENTRATION = 27;     // ppm
    RESOURCE_SOUND = 28;                 // dB
    RESOURCE_FREQUENCY = 29;             // Hz
    RESOURCE_BATTERY_LEVEL = 30;         // %EL
    RESOURCE_BATTERY_VOLTAGE = 31;       // V
    RESOURCE_RADIUS = 32;                // m
    RESOURCE_BATTERY_LEVEL_LOW = 33;     // Ratio (/)
    RESOURCE_COMPASS_X = 34;             // T
    RESOURCE_COMPASS_Y = 35;             // T
    RESOURCE_COMPASS_Z = 36;             // T
    RESOURCE_READ_SWITCH = 37;           // Ratio (/)
    RESOURCE_PRESENCE = 38;
    RESOURCE_COUNTER = 39;
    RESOURCE_INTERNAL_TEMPERATURE = 40;  // Celsius
    RESOURCE_MOISTURE = 41;
    RESOURCE_APPARENT_POWER = 42;        // VA
    RESOURCE_ACCUMULATED_POWER = 43;     // J
    RESOURCE_REACTIVE_POWER = 44;        // VAR
    RESOURCE_POWER_FACTOR = 45;          // Ratio (/)
    RESOURCE_LOG = 46;
    RESOURCE_FREE_HEAP_SIZE = 47;        // B
    RESOURCE_LUMINOUS_FLUX = 48;         // lumen
    RESOURCE_LUMINOUS_INTENSITY = 49;    // candela
    RESOURCE_BRIGHTNESS = 50;            // Ratio (/)
    RESOURCE_BRIGHTENING = 50;           // Ratio (/)
    RESOURCE_SWITCH = 51;
    RESOURCE_CONFIG = 52;
    RESOURCE_IRRADIANCE = 53;            // W/m2
    RESOURCE_FIRMWARE_VERSION = 54;
    RESOURCE_HARDWARE_VERSION = 55;
    RESOURCE_HARDWARE_ID = 56;
    RESOURCE_MANUFACTURING_DATE = 57;
    RESOURCE_DEVICE_NAME = 58;
    RESOURCE_CONNECTED_NETWORK = 59;
    RESOURCE_CONNECTED = 60;
    RESOURCE_N_CONCENTRATION = 61;        // ppm
    RESOURCE_P_CONCENTRATION = 62;        // ppm
    RESOURCE_K_CONCENTRATION = 63;        // ppm
    RESOURCE_CONDUCTIVITY = 64;           // S/m
    RESOURCE_PH = 65;
    RESOURCE_MESH_LEVEL = 66;
    RESOURCE_PRECIPITATION = 67;          // mm
    RESOURCE_SIGNAL_STRENGTH = 68;        // dBm
    RESOURCE_HEAP_MIN_EVER = 69;          // B (int_value), lowest free heap since boot
    RESOURCE_UPTIME = 70;                 // s (int_value), time since the last boot
    RESOURCE_RESET_REASON = 71;           // int_value = ResetReason (esp_reset_reason_t)
    RESOURCE_BOOT_COUNT = 75;             // int_value, NVS meshlink/bootCnt
    RESOURCE_SOC_MODEL = 76;              // string_value, e.g. "esp32s3", "esp32c6"
    RESOURCE_CHIP_REVISION = 77;          // int_value = major*100+minor, e.g. 301 = v3.1
    RESOURCE_MODEM_IMEI = 79;             // string_value, modem IMEI (15 digits)
    RESOURCE_NETWORK_INTERFACE = 80;      // int_value = NetworkInterfaceType
    RESOURCE_MODEM_NETWORK_MODE = 82;     // int_value: 0=GSM, 2=WCDMA/UTRAN, 7=LTE
    RESOURCE_MODEM_BAND = 83;             // int_value = LTE band number (3GPP), e.g. 28
    RESOURCE_MODEM_CELL_ID = 84;          // int_value, serving cell ID (0 = unknown)
    RESOURCE_MODEM_RSRP = 85;             // value in dBm (LTE Reference Signal Received Power)
    RESOURCE_MODEM_RSRQ = 86;             // value in dB (LTE Reference Signal Received Quality)
    RESOURCE_MODEM_SNR = 87;              // value in dB (LTE signal-to-noise ratio)
    RESOURCE_LORA_RSSI = 90;              // value in dBm, measured by the gateway on the received frame
    RESOURCE_LORA_SNR = 91;               // value in dB, measured by the gateway on the received frame
    RESOURCE_LORA_DEVICE_ADDR = 92;       // string_value, LoRa frame deviceAddr in hex (8 digits), proprietary address of Meshlink raw LoRa
    RESOURCE_MODEM_MCC = 93;              // int_value, Mobile Country Code (ITU E.212), e.g. 724 = Brazil
    RESOURCE_MODEM_MNC = 94;              // int_value, Mobile Network Code (ITU E.212), identifies the carrier within the country
    // IDs 95 to 99 are used by the Meshlink proto (LoRa gateway and endnode
    // counters) and are intentionally not defined here. New Techfab resources
    // start at 100 so the two protos never assign the same number to
    // different data.
    RESOURCE_MODEM_APN = 100;             // string_value, APN in use by the 4G modem (never the PAP credentials)
    RESOURCE_NTP_LAST_SYNC = 101;         // int_value, Unix time in seconds of the last successful NTP sync (0 = never)
    RESOURCE_AP_SSID = 102;               // string_value, SSID of the soft AP created by the device (never its password)
    RESOURCE_AP_CHANNEL = 103;            // int_value, Wi-Fi channel of the soft AP (1 to 13)
    RESOURCE_AP_STATION_COUNT = 104;      // int_value, number of stations associated to the soft AP
    RESOURCE_AP_STATION_LIST = 105;       // string_value, associated station MACs as "aa:bb:cc:dd:ee:ff" separated by commas; truncated at the last whole MAC that fits the record
}

// Aligned with esp_reset_reason_t (ESP-IDF), so the firmware sends the value
// of esp_reset_reason() as is. Sent in Record.int_value; string_value is not
// used for this resource.
enum ResetReason {
    RESET_REASON_UNKNOWN = 0;
    RESET_REASON_POWERON = 1;      // Power-on reset
    RESET_REASON_EXT = 2;          // External pin reset
    RESET_REASON_SW = 3;           // Software reset via esp_restart()
    RESET_REASON_PANIC = 4;        // Software reset due to an exception or panic
    RESET_REASON_INT_WDT = 5;      // Interrupt watchdog
    RESET_REASON_TASK_WDT = 6;     // Task watchdog
    RESET_REASON_WDT = 7;          // Other watchdog
    RESET_REASON_DEEPSLEEP = 8;    // Woke from deep sleep
    RESET_REASON_BROWNOUT = 9;     // Brownout reset
    RESET_REASON_SDIO = 10;        // Reset over SDIO
    RESET_REASON_USB = 11;         // Reset by USB peripheral
    RESET_REASON_JTAG = 12;        // Reset by JTAG
    RESET_REASON_EFUSE = 13;       // Reset due to an eFuse error
    RESET_REASON_PWR_GLITCH = 14;  // Reset due to a power glitch
    RESET_REASON_CPU_LOCKUP = 15;  // Reset due to CPU lockup
}

enum NetworkInterfaceType {
    NETWORK_INTERFACE_UNSPECIFIED = 0;
    NETWORK_INTERFACE_MESH = 1;       // WiFi mesh (tef-mesh-lite)
    NETWORK_INTERFACE_WIFI = 2;       // WiFi STA direto ao roteador
    NETWORK_INTERFACE_ETHERNET = 3;   // Ethernet cabeada
    NETWORK_INTERFACE_4G_LTE = 4;     // Modem celular 4G/LTE via PPP
    NETWORK_INTERFACE_LORA = 5;       // LoRa via gateway
}

enum NetworkType {
    NETWORK_TYPE_UNSPECIFIED = 0;
    NETWORK_TYPE_MQTT_1 = 1;
    NETWORK_TYPE_LORAWAN_1 = 2;
    NETWORK_TYPE_LORAWAN_2 = 3;
    NETWORK_TYPE_LORAWAN_3 = 4;
    NETWORK_TYPE_MESHLINK_LORA_1 = 5;  // Meshlink proprietary raw LoRa (HMAC, custom framing); not LoRaWAN
}

enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_LOW = 1;
    SEVERITY_HIGH = 2;
    SEVERITY_URGENT = 3;
}

message SemVer {
    int32 major = 1;
    int32 minor = 2;
    int32 patch = 3;
}

message Record {
    Resource resource = 1;
    int64 time = 4;
    double value = 5;
    string string_value = 6;
    bool bool_value = 7;
    bytes data_value = 8;
    Severity severity = 9;
    uint32 alert_id = 10;
    int64 int_value = 11;
}

message TelemetryPack {
    repeated Record records = 1;
    Resource base_resource = 2;
    int64 base_time = 4;
    NetworkType network_type = 6;
    bytes network_id = 7;
}
